<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heaven Cookies</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#241710;--card:#302016;--ink:#f3e6d3;--mut:#bfa78e;--br:#d29a5e;--br2:#e8b27a;--line:#4a3424;--ok:#3d7a4a;--bad:#c4503f;--on:#2a170c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Nunito Sans',system-ui,sans-serif;padding-bottom:90px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.wrap{max-width:720px;margin:auto;padding:0 16px}
.top{background:var(--br2);color:#f6ecdd;padding:22px 0 18px}.top .wrap{display:flex;gap:14px;align-items:center}
.top img{width:74px;height:74px;border-radius:50%;background:#f6ecdd;object-fit:cover}
.top h1{font-size:30px;line-height:1}.top p{margin:4px 0 0;opacity:.85;font-size:13px}
.info{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 0;color:var(--mut);font-size:13px}.info b{color:var(--ink)}
.chips{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}.chips .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
.chips a{white-space:nowrap;padding:7px 16px;border-radius:99px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;background:var(--card)}
h2{font-size:26px;margin:24px 0 10px;color:var(--br2)}
.it{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.it .tx{flex:1;min-width:0;display:flex;flex-direction:column}.it h3{font-size:20px}.it p{margin:4px 0 8px;color:var(--mut);font-size:13px}
.it .pr{margin-top:auto;font-weight:700;color:var(--br)}.it img{width:104px;height:104px;border-radius:10px;object-fit:cover;flex:none;align-self:center}
.it.off{opacity:.55}.stp{display:flex;align-items:center;gap:10px;margin-top:8px}
.stp button,.add{line-height:1;border:0;background:var(--br);color:var(--on);border-radius:99px;font-weight:700}.stp button{width:32px;height:32px;font-size:18px}.stp .add{width:auto;height:auto;padding:9px 18px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line);z-index:9}
.bar button{width:100%;max-width:688px;display:flex;justify-content:space-between;margin:auto;padding:14px 18px;border:0;border-radius:12px;background:var(--br2);color:var(--on);font-weight:700;font-size:16px}
.sh{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end;justify-content:center}.sh.on{display:flex}
.pn{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:13px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;justify-content:space-between;padding:4px 0}.tot{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);cursor:pointer}.seg input{display:none}.seg input:checked+span{color:var(--br);font-weight:700}
.seg label:has(input:checked){border-color:var(--br);box-shadow:0 0 0 1px var(--br)}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--br2);color:var(--on);font-weight:700;width:100%;margin-top:14px}.btn.s{width:auto;margin:0;padding:8px 14px}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}.track{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin:12px 0}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:24px}.foot a{color:var(--mut)}
.oc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.oc.new{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line)}.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1}.pe{display:grid;grid-template-columns:70px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.pe img{width:70px;height:70px;border-radius:8px;object-fit:cover}.pe input,.pe textarea{margin-bottom:6px}
.dm{background:var(--line);padding:8px 12px;border-radius:10px;font-size:12px;color:var(--ink);margin:10px 0}
</style></head><body>

function menuView(){
const ps=P(),cats=[...new Set(ps.map(p=>p.cat))];
$('#app').innerHTML=`<div class="top"><div class="wrap"><img src="${LOGO}" alt="Heaven Cookies"><div><h1>Heaven Cookies</h1><p>Um pedacinho do céu em cada mordida</p></div></div></div>

bar();renderMyOrder()}
function itemHTML(p){const q=cart[p.id]||0;return `<div class="it ${p.on?'':'off'}"><div class="tx"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="pr">${fmt(p.price)}</div>${p.on?(q?`<div class="stp"><button aria-label="Remover" onclick="chg('${p.id}',-1)">−</button><b>${q}</b><button aria-label="Adicionar" onclick="chg('${p.id}',1)">+</button></div>`:`<div class="stp"><button class="add" onclick="chg('${p.id}',1)">Adicionar</button></div>`):'<div class="stp"><b>Indisponível</b></div>'}</div>${p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:''}</div>`}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];const y=scrollY;menuView();scrollTo(0,y)}
const lines=()=>P().filter(p=>cart[p.id]).map(p=>({n:p.name,q:cart[p.id],p:p.price}));
const sub=()=>lines().reduce((s,l)=>s+l.q*l.p,0),cnt=()=>lines().reduce((s,l)=>s+l.q,0);

function closeCart(){$('#sh').classList.remove('on');refresh()}
function cartHTML(keep){const v=keep||{};$('#pn').innerHTML=`<h2 style="margin-top:0">Sua sacola</h2>${lines().map(l=>`<div class="row"><span>${l.q}× ${esc(l.n)}</span><span>${fmt(l.q*l.p)}</span></div>`).join('')}
<label>Como quer receber?</label><div class="seg"><label><input type="radio" name="m" value="entrega" ${mode=='entrega'?'checked':''} onchange="setMode(this.value)"><span>Entrega</span></label><label><input type="radio" name="m" value="retirada" ${mode=='retirada'?'checked':''} onchange="setMode(this.value)"><span>Retirada</span></label></div>
<label>Seu nome</label><input id="fn" autocomplete="name" value="${esc(v.fn)}"><label>WhatsApp</label><input id="fp" type="tel" autocomplete="tel" value="${esc(v.fp)}">
${mode=='entrega'?`<label>Endereço completo</label><input id="fa" autocomplete="street-address" value="${esc(v.fa)}"><label>Distância aproximada até você (km, máx. ${MAXKM})</label><input id="fk" type="number" min="0.5" max="${MAXKM}" step="0.5" inputmode="decimal" oninput="tot()" value="${esc(v.fk)}">`:''}
<label>Pagamento</label><select id="fy" onchange="tot()"><option>Pix</option><option>Dinheiro</option><option>Cartão (maquininha)</option></select><div id="tr"></div>
<label>Observações</label><textarea id="fo" rows="2"></textarea>
<div id="tt"></div><div class="err" id="er"></div><button class="btn" onclick="send()">Enviar pedido</button><button class="btn g" onclick="closeCart()">Continuar escolhendo</button>`;tot()}
function setMode(m){const v={fn:$('#fn').value,fp:$('#fp').value,fa:$('#fa')?.value,fk:$('#fk')?.value};mode=m;cartHTML(v)}
function fee(){if(mode!='entrega')return 0;return Math.max(0,parseFloat($('#fk')?.value)||0)*KM}
function tot(){const f=fee();$('#tt').innerHTML=`<div class="row"><span>Subtotal</span><span>${fmt(sub())}</span></div>${mode=='entrega'?`<div class="row"><span>Taxa de entrega</span><span>${fmt(f)}</span></div>`:''}<div class="row tot"><span>Total</span><span>${fmt(sub()+f)}</span></div>`;
$('#tr').innerHTML=$('#fy').value=='Dinheiro'?'<label>Troco para quanto? (opcional)</label><input id="ft" inputmode="decimal">':''}
function send(){const e=m=>{$('#er').textContent=m;return 0};const n=$('#fn').value.trim(),ph=$('#fp').value.trim();
if(sub()<MIN)return e(`O pedido mínimo é ${fmt(MIN)}.`);if(!n||ph.length<8)return e('Informe seu nome e WhatsApp.');
let a='',km=0;if(mode=='entrega'){a=$('#fa').value.trim();km=parseFloat($('#fk').value)||0;if(!a)return e('Informe o endereço de entrega.');if(km<=0||km>MAXKM)return e(`Entregamos até ${MAXKM} km. Informe a distância ou escolha retirada.`)}
const f=km*KM,o={id:Date.now().toString(36),t:Date.now(),items:lines(),sub:sub(),fee:f,total:sub()+f,mode,name:n,phone:ph,addr:a,km,pay:$('#fy').value,troco:$('#ft')?.value||'',obs:$('#fo').value.trim(),st:'novo'};
db.collection('orders').add(o).then(r=>{try{localStorage.setItem('hc_my',r.id)}catch(e){}watchMy(r.id);cart={};closeCart();menuView();scrollTo(0,0)}).catch(()=>{$('#er').textContent='Não foi possível enviar o pedido. Tente novamente.'})}
function renderMyOrder(){const el=$('#my');if(!el)return;const o=MYORD;el.innerHTML=o?`<div class="track"><b>Seu pedido: ${ST[o.st]}</b><div style="color:var(--mut);font-size:13px;margin-top:4px">${o.items.map(l=>l.q+'× '+esc(l.n)).join(', ')} · ${fmt(o.total)}</div></div>`:''}
/* ---------- ADMIN ---------- */
function adminView(){if(!authed()){$('#app').innerHTML=`<div class="wrap" style="padding-top:40px"><h1>Entrar</h1><label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Senha</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn" onclick="login()">Entrar</button><button class="btn g" onclick="location.hash=''">Voltar ao cardápio</button></div>`;return}
const os=O(),nn=os.filter(o=>o.st==='novo').length;
$('#app').innerHTML=`<div class="wrap" style="padding-top:16px"><div style="display:flex;justify-content:space-between;align-items:center"><h1>Painel</h1><div style="display:flex;gap:8px"><button class="btn g s" onclick="location.hash=''">Ver cardápio</button><button class="btn g s" onclick="logout()">Sair</button></div></div>
<button class="btn ${soundOn?'ok':''}" onclick="enableSound()">${soundOn?'Alerta sonoro ativado':'Ativar alerta sonoro'}</button>
<div class="tabs"><button class="btn g s" style="${adminTab=='ped'?'border-color:var(--br)':''}" onclick="adminTab='ped';adminView()">Pedidos${nn?` (${nn} novo${nn>1?'s':''})`:''}</button><button class="btn g s" style="${adminTab=='prod'?'border-color:var(--br)':''}" onclick="adminTab='prod';adminView()">Produtos</button></div>
${adminTab=='ped'?(os.length?os.map(orderHTML).join(''):'<p style="color:var(--mut)">Nenhum pedido ainda. Eles aparecem aqui assim que chegarem.</p>'):prodHTML()}</div>`}
function login(){auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>{$('#er').textContent='E-mail ou senha incorretos.'})}
function logout(){auth.signOut()}
function orderHTML(o){const t=new Date(o.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const b={novo:`<button class="btn ok s" onclick="setSt('${o.id}','aceito')">Aceitar</button><button class="btn no s" onclick="setSt('${o.id}','recusado')">Recusar</button>`,aceito:`<button class="btn s" onclick="setSt('${o.id}','pronto')">Marcar como pronto</button>`,pronto:`<button class="btn ok s" onclick="setSt('${o.id}','concluido')">Concluir</button>`}[o.st]||'';
return `<div class="oc ${o.st=='novo'?'new':''}"><div class="row"><b>${esc(o.name)} · ${t}</b><span class="tag">${ST[o.st]}</span></div>${o.items.map(l=>`<div>${l.q}× ${esc(l.n)}</div>`).join('')}
<div style="color:var(--mut);font-size:13px;margin-top:6px">${o.mode=='entrega'?`Entrega (${o.km} km, taxa ${fmt(o.fee)}): ${esc(o.addr)}`:'Retirada'}<br>WhatsApp: ${esc(o.phone)} · ${esc(o.pay)}${o.troco?' · troco p/ '+esc(o.troco):''}${o.obs?'<br>Obs: '+esc(o.obs):''}</div><div class="row tot"><span>Total</span><span>${fmt(o.total)}</span></div><div class="acts">${b}</div></div>`}
function setSt(id,s){db.collection('orders').doc(id).update({st:s}).catch(()=>alert('Não foi possível atualizar.'))}
function prodHTML(){return P().map((p,i)=>`<div class="pe"><label style="margin:0;cursor:pointer">${p.img?`<img src="${p.img}" alt="">`:'<div class="pe-i" style="width:70px;height:70px;background:var(--line);border-radius:8px"></div>'}<input type="file" accept="image/*" hidden onchange="photo(${i},this.files[0])"><span style="font-size:11px;color:var(--mut)">Trocar foto</span></label><div><input value="${esc(p.name)}" onchange="upd(${i},'name',this.value)" aria-label="Nome"><input value="${esc(p.cat)}" onchange="upd(${i},'cat',this.value)" aria-label="Categoria"><textarea rows="2" onchange="upd(${i},'desc',this.value)" aria-label="Descrição">${esc(p.desc)}</textarea><input type="number" step="0.5" min="0" value="${p.price}" onchange="upd(${i},'price',parseFloat(this.value)||0)" aria-label="Preço"><div class="acts"><button class="btn s ${p.on?'ok':'g'}" onclick="upd(${i},'on',${!p.on},1)">${p.on?'Disponível':'Indisponível'}</button><button class="btn s no" onclick="delP(${i})">Excluir</button></div></div></div>`).join('')+`<button class="btn" onclick="addP()">Novo produto</button>`}
function upd(i,k,v){db.collection('products').doc(P()[i].id).update({[k]:v}).catch(()=>alert('Não foi possível salvar.'))}
function delP(i){if(!confirm('Excluir este produto?'))return;db.collection('products').doc(P()[i].id).delete()}
function addP(){db.collection('products').doc('p'+Date.now()).set({cat:'Novidades',name:'Novo produto',desc:'Descrição',price:0,img:'',on:false,ord:Date.now()})}
function photo(i,f){if(!f)return;const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,500/Math.max(m.width,m.height));c.width=m.width*s;c.height=m.height*s;c.getContext('2d').drawImage(m,0,0,c.width,c.height);upd(i,'img',c.toDataURL('image/jpeg',.78))};m.src=r.result};r.readAsDataURL(f)}
/* ---------- SOM ---------- */
function beep(){if(!soundOn||!ac)return;[0,.25].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=d?988:784;g.gain.setValueAtTime(.4,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.22);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.24)})}
function enableSound(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();soundOn=true;beep();adminView()}
setInterval(()=>{if(location.hash==='#admin'&&authed()&&O().some(o=>o.st==='novo'))beep()},4000);
function refresh(){if(location.hash==='#admin'){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&(!authed()||adminTab=='prod'))return;adminView()}else if(!$('#sh')?.classList.contains('on')){const y=scrollY;menuView();scrollTo(0,y)}}
function seed(){const b=db.batch();DEF.forEach((p,i)=>{const {id,...r}=p;b.set(db.collection('products').doc(id),{...r,ord:i})});b.commit().catch(()=>{})}
db.collection('products').onSnapshot(s=>{PRODS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ord||0)-(b.ord||0));if(!PRODS.length&&USER)seed();refresh()},()=>{PRODS=[];refresh()});
auth.onAuthStateChanged(u=>{USER=u;if(unsubO){unsubO();unsubO=null}ORDERS=[];firstO=true;if(u){if(PRODS&&!PRODS.length)seed();unsubO=db.collection('orders').orderBy('t','desc').limit(100).onSnapshot(s=>{if(!firstO&&s.docChanges().some(c=>c.type==='added'&&c.doc.data().st==='novo'))beep();firstO=false;ORDERS=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},()=>{})}if(document.activeElement)document.activeElement.blur();refresh()});
function watchMy(id){if(unsubM)unsubM();unsubM=db.collection('orders').doc(id).onSnapshot(s=>{MYORD=s.exists?{id:s.id,...s.data()}:null;renderMyOrder()},()=>{})}
try{const m=localStorage.getItem('hc_my');if(m)watchMy(m)}catch(e){}
route();
</script></body></html>
